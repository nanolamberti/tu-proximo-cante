:root{--bg:#f7f5f0;--ink:#29232d;--muted:#756c79;--purple:#482b60;--lilac:#eae1f0;--orange:#cc6748;--line:#ded9df;--paper:#fffcf8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 system-ui,-apple-system,sans-serif}button,input,textarea{font:inherit}button,a{touch-action:manipulation}button{cursor:pointer}button:disabled{cursor:default;opacity:.45}a{color:inherit}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--orange);outline-offset:4px}header{max-width:1280px;margin:auto;padding:23px 40px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);gap:20px}header img{width:168px;max-height:65px;object-fit:contain}.wordmark{font-size:12px;letter-spacing:.1em;font-weight:750}.top-actions{display:flex;align-items:center;gap:24px}.quiet{border:0;background:none;color:var(--muted);padding:8px 0;font-size:13px}.pill{font-size:10px;text-transform:uppercase;letter-spacing:.12em;border:1px solid var(--line);padding:6px 11px;border-radius:30px}main{max-width:1180px;margin:auto;padding:58px 40px 80px}.eyebrow{font-size:11px;letter-spacing:.17em;text-transform:uppercase;color:var(--purple);font-weight:750}h1,h2,h3{font-family:Georgia,'Iowan Old Style',serif;font-weight:400;line-height:1.1;margin:15px 0 24px}h1{font-size:clamp(42px,5.3vw,72px);letter-spacing:-.05em}h2{font-size:clamp(32px,4vw,48px);letter-spacing:-.035em}h3{font-size:26px;letter-spacing:-.02em}p{margin:12px 0}em{color:var(--purple);font-weight:400}.muted{color:var(--muted)}.small{font-size:12px;color:var(--muted)}.hero{display:grid;grid-template-columns:1.15fr 1fr;gap:55px;align-items:center}.hero-copy>p{max-width:550px;font-size:17px;color:var(--muted)}.actions{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:28px}.primary,.secondary{padding:15px 22px;border-radius:8px;font-size:14px;font-weight:650;line-height:1.4;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:14px}.primary{background:var(--purple);color:white;border:1px solid var(--purple)}.primary:hover{background:#362046}.secondary{background:transparent;border:1px solid #bfb5c6;color:var(--purple)}.secondary:hover{background:#eee8f1}.micro{margin:18px 0!important;font-size:12px!important;color:var(--muted)}.visual{position:relative;min-height:390px;padding:25px 6px;isolation:isolate}.visual:before{content:'';position:absolute;inset:10px -15px;background:radial-gradient(ellipse,#e1cfe7 0%,#eee5e8 37%,transparent 69%);z-index:-1}.sheet{background:var(--paper);border:1px solid #d7ccd9;border-radius:12px;padding:27px;box-shadow:0 25px 60px #38244914;transform:rotate(-4deg);max-width:360px;margin:auto}.sheet .bad{font-family:Georgia,serif;font-size:29px;line-height:1.25;color:#8b798d;text-decoration:line-through;text-decoration-thickness:1px;text-decoration-color:#c8bac9}.sheet hr{border:0;border-top:1px solid var(--line);margin:23px 0}.sheet .good{font-family:Georgia,serif;font-size:25px;line-height:1.3}.sheet .label{font-size:10px;text-transform:uppercase;letter-spacing:.14em;color:var(--muted)}.floating{position:absolute;bottom:0;right:-5px;max-width:245px;background:var(--purple);color:#fff;border-radius:10px;padding:18px 21px;box-shadow:0 14px 30px #38244920;font-size:13px;transform:rotate(3deg)}.floating b{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:#dac8e6;margin-bottom:7px}.route{margin-top:70px;display:grid;grid-template-columns:repeat(3,1fr);gap:30px;padding:30px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.route b{display:block;font-weight:650;font-size:15px}.route span{font-size:11px;letter-spacing:.13em;color:var(--orange)}.route p{font-size:13px;color:var(--muted);margin-bottom:0}.authority{display:flex;align-items:flex-start;gap:24px;padding:28px 0;max-width:800px}.jm{min-width:48px;height:48px;border-radius:50%;background:var(--lilac);display:grid;place-items:center;font-family:Georgia,serif;color:var(--purple)}.authority p{font-size:13px;margin:0}.authority b{font-weight:650}.hidden{display:none!important}.workspace{max-width:830px;margin:0 auto}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:24px}.progress{height:4px;background:#e6dfe8;border-radius:10px;overflow:hidden;margin-bottom:32px}.progress span{display:block;height:100%;background:var(--purple);transition:width .3s}.panel{padding:34px 42px;background:var(--paper);border:1px solid var(--line);border-radius:15px;box-shadow:0 16px 50px #38244906;animation:arrive .22s ease-out}@keyframes arrive{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}.panel h2{margin-top:8px}.lead{color:var(--muted);font-size:15px;max-width:620px}.choices{display:grid;gap:12px;margin:26px 0}.choice{width:100%;display:flex;text-align:left;align-items:center;gap:16px;padding:19px 21px;border:1px solid var(--line);border-radius:10px;background:white;color:var(--ink);transition:background .15s,border-color .15s}.choice .icon{font-size:17px;color:var(--purple);border:1px solid #e3dce7;width:32px;height:32px;min-width:32px;display:grid;place-items:center;border-radius:50%}.choice strong{display:block;font-size:15px;font-weight:650}.choice small{display:block;color:var(--muted);font-size:12px;margin-top:3px}.choice.selected{background:#f0e8f4;border-color:var(--purple)}.choice:hover{border-color:#a08cae}label{display:block;font-size:13px;font-weight:650;margin:20px 0 8px}input,textarea{width:100%;padding:15px 17px;border:1px solid #d7cfdc;border-radius:8px;background:white;color:var(--ink)}textarea{min-height:120px;resize:vertical;line-height:1.6}input::placeholder,textarea::placeholder{color:#a39aa5;font-size:14px}.hint{font-size:12px;color:var(--muted);margin:8px 0}.insight{border-left:3px solid var(--orange);background:#f7eee8;padding:16px 20px;font-size:13px;margin:25px 0}.insight strong{display:block;margin-bottom:5px}.demo{background:var(--lilac);color:var(--purple);border-radius:8px;padding:12px 17px;font-size:12px;margin-bottom:24px}.error{font-size:13px;color:#923b34;margin:12px 0}.bottom{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-top:30px}.report-head{border-bottom:1px solid var(--line);padding-bottom:22px;margin-bottom:25px}.report-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.report-card{padding:23px;border:1px solid var(--line);border-radius:10px;background:#fff}.report-card .eyebrow{font-size:10px;letter-spacing:.1em}.report-card p{font-size:14px;white-space:pre-wrap}.wide{grid-column:1/-1}.spotlight{background:var(--purple);color:#fff;border:0}.spotlight .eyebrow{color:#d6c3e3}.spotlight p{font-family:Georgia,serif;font-size:25px;line-height:1.35}.bridge{border-top:1px solid var(--line);padding-top:30px;margin-top:35px}.bridge p{font-size:14px;color:var(--muted)}.tag{font-size:11px;display:inline-block;background:var(--lilac);color:var(--purple);padding:5px 10px;border-radius:20px;margin:0 8px 8px 0}.entry{padding:22px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:20px;align-items:center}.entry strong{font-size:15px}.entry p{font-size:12px;color:var(--muted);margin:4px 0}details{font-size:12px;color:var(--muted);margin-top:30px}summary{cursor:pointer}footer{border-top:1px solid var(--line);max-width:1180px;margin:auto;padding:24px 40px;display:flex;justify-content:space-between;gap:20px;font-size:11px;color:var(--muted)}.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:var(--purple);color:white;padding:13px 22px;border-radius:8px;font-size:13px;z-index:9;max-width:90%}@media(max-width:760px){header{padding:17px 22px}header img{width:135px}.pill{display:none}main{padding:34px 22px 50px}.hero{grid-template-columns:1fr;gap:30px}h1{font-size:47px}.visual{min-height:310px;padding:5px 10px 40px}.sheet{max-width:310px;padding:23px}.sheet .bad{font-size:25px}.sheet .good{font-size:23px}.floating{right:0;bottom:0;max-width:230px}.route{margin-top:40px;grid-template-columns:1fr;gap:22px}.route>div{display:grid;grid-template-columns:30px 1fr}.route p{grid-column:2}.panel{padding:25px 21px}.report-grid{grid-template-columns:1fr}.wide{grid-column:auto}.toolbar{font-size:12px}.top-actions{gap:12px}.primary,.secondary{font-size:13px;padding:14px 17px}.authority{gap:15px}footer{padding:22px;display:block}.entry{align-items:flex-start}.entry .secondary{white-space:nowrap}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}@media print{header,footer,.toolbar,.progress,.actions,.bottom,.bridge,.demo,details,.toast{display:none!important}body{background:white}main{padding:0}.panel{border:0;box-shadow:none;padding:0}.report-card{break-inside:avoid}.spotlight{color:black;background:#eee}.spotlight .eyebrow{color:black}.workspace{max-width:none}}
</style></head><body><header><a href="https://inteligenciaopositora.com/" aria-label="Inteligencia Opositora"><img alt="Inteligencia Opositora" src="https://inteligenciaopositora.com/wp-content/uploads/2022/06/Inteligencia-opositora-logo-ompfhh6ew99kmp8b3kw618y94f8fkfm86namhgc58k.png"></a><div class="top-actions"><span class="pill">Tu próximo cante</span><button class="quiet" id="historyBtn">Mis fichas ↗</button></div></header><main id="main"></main><footer><span>Inteligencia Opositora · Entrenamiento mental con Juan Manuel Ruigómez</span><span>Tu temario y su corrección siguen en manos de tu preparador.</span></footer><div id="toast" class="toast hidden" role="status"></div><script>
const main=document.getElementById('main'),key='io-cante-v1';let records=[],draft={},step=0,mode='after',demo=false,goal='claridad',timer;let today=()=>new Date().toLocaleDateString('es-ES');try{const s=JSON.parse(localStorage.getItem(key)||'{}');records=Array.isArray(s.registros)?s.registros.filter(x=>x&&typeof x.tema==='string'&&typeof x.hechos==='string').slice(0,100):[]}catch{}
const goals={claridad:['Que se distingan mejor las partes del tema','Transiciones, pausas e ideas importantes.'],recuperar:['Retomar el hilo cuando me atasco','Practicar cómo continuar sin dar todo por perdido.'],preparador:['Llegar al preparador sin vivirlo como un veredicto','Entrar en el ensayo con una intención concreta.'],dificil:['Dejar de evitar el tema que más me cuesta','Acercarme a una dificultad que necesito trabajar.']};
const practices={claridad:'Elige el cambio de apartado que te costó. Ensaya ese fragmento marcando la transición y la idea principal. Pide al preparador que te indique si resulta más fácil seguirte.',recuperar:'Lleva al preparador el punto concreto donde perdiste el hilo. Acuerda cómo retomarlo y practica ese fragmento manteniendo el rigor del contenido, sin inventar artículos ni afirmaciones.',preparador:'Antes del siguiente encuentro, relee un hecho y una corrección de esta ficha. Lleva una pregunta concreta sobre tu exposición para que el cante te dé información útil.',dificil:'Elige un fragmento del tema que tiendes a evitar. Practícalo con la intención que has preparado y recoge qué necesitas consultar al preparador.'};
const example={tema:'La causa de los contratos',hechos:'Al cambiar de apartado me quedé en silencio. Repetí la última frase, hice una pausa y pude continuar sin empezar el tema de nuevo.',feedback:'El contenido estaba, pero en el cambio de apartado me costó seguirte. Trabaja esa transición y deja que se distinga la idea principal.',interpretacion:'Si me atasco aquí, no voy a ser capaz de cantar ante el tribunal.',acierto:'Después de la pausa retomé el hilo y seguí con el tema.',ajuste:'Ensayar esa transición con una pausa y pedir al preparador que me diga si se distingue mejor.',ancla:'Recuerdo una explicación que conseguí terminar con calma, aunque empecé nervioso.',intencion:'Que se distingan las partes del tema, sin correr al cambiar de apartado.'};
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function msg(s){const t=document.getElementById('toast');t.textContent=s;t.classList.remove('hidden');clearTimeout(timer);timer=setTimeout(()=>t.classList.add('hidden'),4000)}function save(){try{localStorage.setItem(key,JSON.stringify({version:1,registros:records}));return true}catch{msg('No se ha podido guardar. Imprime la ficha para conservarla.');return false}}function bind(id,fn){const e=document.getElementById(id);if(e)e.onclick=fn}function top(){window.scrollTo({top:0,behavior:'smooth'})}function card(label,value,cls=''){return '<article class="report-card '+cls+'"><div class="eyebrow">'+label+'</div><p>'+esc(value)+'</p></article>'}
function home(){demo=false;main.innerHTML=`<section class="hero"><div class="hero-copy"><div class="eyebrow">Para tu preparación de Notarías</div><h1>Que un mal cante<br>no decida cómo<br><em>estudias mañana.</em></h1><p>Prepara cómo vas a entrar. Separa lo que pasó de lo que te estás diciendo. Y sal con un ajuste concreto para el siguiente cante.</p><div class="actions"><button class="primary" id="start">Preparar mi próximo cante <span>→</span></button><button class="secondary" id="demoBtn">Ver un ejemplo de Notarías</button></div><p class="micro">Sin registro · A tu ritmo · Tus fichas se quedan en este navegador</p></div><div class="visual" aria-label="De una valoración general a una práctica concreta"><div class="sheet"><div class="label">Lo que te dices al salir</div><p class="bad">«Me ha salido fatal.<br>No avanzo.»</p><hr><div class="label">Lo que puedes trabajar</div><p class="good">«Me atasqué al cambiar de apartado. Voy a ensayar esa transición.»</p><span class="tag">Una acción, no una sentencia.</span></div><div class="floating"><b>Tu próxima práctica</b>Un fragmento. Una intención.<br>Una pregunta al preparador.</div></div></section><section class="route"><div><span>01</span><b>Antes: entra con una intención</b><p>Elige qué quieres practicar, sin exigirte cambiarlo todo.</p></div><div><span>02</span><b>Después: recoge lo que ocurrió</b><p>Hechos, correcciones y pensamientos, cada uno en su sitio.</p></div><div><span>03</span><b>La próxima vez: lleva un ajuste</b><p>Conserva lo que funcionó y concreta qué vas a ensayar.</p></div></section><div class="authority"><span class="jm" aria-hidden="true">JM</span><div><p><b>Basada en las lecciones de Juan Manuel Ruigómez sobre el cante.</b></p><p class="muted">Abogado del Estado, dedicado a la preparación mental de opositores desde 2004. Esta herramienta organiza tu reflexión; la valoración académica corresponde a tu preparador.</p></div></div><details><summary>Qué hace esta herramienta y dónde se guardan tus datos</summary><p>Organiza tus respuestas y propone una práctica según el objetivo elegido. No escucha grabaciones, no utiliza IA generativa ni califica tu cante. Las adaptaciones de las lecciones están pendientes de validación final por Juan Manuel. No incluye cobros ni acceso protegido por compra.</p><p>Las fichas se guardan solo en este navegador. Puedes exportarlas, importarlas o borrarlas en «Mis fichas». No se envían a Juan Manuel ni a Systeme.</p></details>`;bind('start',chooseMode);bind('demoBtn',()=>{demo=true;draft={...example};goal='claridad';mode='after';step=0;wizard();top()});top()}
function shell(content,progress=0){main.innerHTML='<div class="workspace"><div class="toolbar"><button class="quiet" id="homeBtn">← Volver al inicio</button><span class="eyebrow">Tu próximo cante</span></div>'+(progress?'<div class="progress" aria-label="Progreso"><span style="width:'+progress+'%"></span></div>':'')+(demo?'<div class="demo"><strong>Ejemplo ficticio · Notarías.</strong> Recorre las respuestas y descubre la ficha final. No se guarda en tu historial ni cambia tus fichas.</div>':'')+'<section class="panel">'+content+'</section></div>';bind('homeBtn',()=>{if(Object.keys(draft).length&&!demo&&!confirm('¿Volver al inicio? Las respuestas de este recorrido aún no se han guardado en una ficha.'))return;home()})}
function chooseMode(){demo=false;draft={};goal='claridad';shell('<div class="eyebrow">Empieza donde estás</div><h2>¿En qué momento<br>te encuentras?</h2><p class="lead">Elige lo que necesitas hoy. Puedes preparar el ensayo o revisar un cante que ya has hecho.</p><div class="choices"><button class="choice" id="before"><span class="icon">↗</span><span><strong>Voy a cantar</strong><small>Quiero entrar con una intención y preparar mi ritual.</small></span></button><button class="choice" id="after"><span class="icon">↺</span><span><strong>Ya he cantado</strong><small>Quiero recoger lo útil y saber qué practicar después.</small></span></button></div>');for(const m of ['before','after'])bind(m,()=>{mode=m;step=0;wizard();top()});top()}
function goalChoices(){return '<div class="choices">'+Object.entries(goals).map(([k,v],i)=>'<button type="button" class="choice '+(goal===k?'selected':'')+'" data-goal="'+k+'" aria-pressed="'+(goal===k)+'"><span class="icon">'+String(i+1).padStart(2,'0')+'</span><span><strong>'+v[0]+'</strong><small>'+v[1]+'</small></span></button>').join('')+'</div>'}
function field(id,label,placeholder,required=false,short=false){return '<label for="'+id+'">'+label+(required?'':' <span class="small">· opcional</span>')+'</label>'+(short?'<input':'<textarea')+' id="'+id+'" maxlength="2500" '+(required?'required':'')+' placeholder="'+placeholder+'">'+(short?'':esc(draft[id]||'')+'</textarea>')}
function wizard(){let title='',intro='',body='',fields=[];const count=mode==='before'?3:5;if(step===0){title='Un tema. Un objetivo.';intro='Piensa en una práctica concreta. Tu ficha será más útil si eliges una sola cosa que trabajar.';body=field('tema','¿Qué tema vas a trabajar?', 'Por ejemplo: La causa de los contratos',true,true)+goalChoices();fields=['tema']}
if(mode==='after'&&step===1){title='¿Qué pasó, exactamente?';intro='«Me ha salido mal» no te dice qué practicar. Un momento concreto, sí.';body=field('hechos','Describe lo que ocurrió','Dónde te atascaste, cómo continuaste, qué pudiste terminar…',true)+field('feedback','¿Qué observó tu preparador?','Recoge su corrección. Si has practicado en casa, puedes dejarlo vacío.')+'<div class="insight"><strong>Quédate con algo observable.</strong>«Me detuve al cambiar de apartado» describe un hecho. «Soy un desastre» no describe tu exposición.</div>';fields=['hechos','feedback']}
if(mode==='after'&&step===2){title='¿Y qué te has dicho después?';intro='A veces el cante termina, pero tú sigues dentro. Pon aquí ese pensamiento para poder mirarlo junto a los hechos.';body=field('interpretacion','¿Qué conclusión te ha venido a la cabeza?','Por ejemplo: Si me pasa esto ahora, no voy a poder en el examen.')+'<div class="insight"><strong>Una práctica no resume toda tu preparación.</strong>Tu interpretación merece atención. También merece que la contrastes con lo que ocurrió y con la corrección del preparador.</div>';fields=['interpretacion']}
if(mode==='after'&&step===3){title='¿Qué conviene conservar?';intro='Un cante difícil también puede contener algo que te ayudó. No hace falta que todo haya salido bien para reconocerlo.';body=field('acierto','Un comportamiento que quieres repetir','Por ejemplo: retomé el hilo después de la pausa.')+'<p class="hint">Si aún no lo ves, déjalo en blanco. La ficha te dará una pregunta para tu preparador.</p>';fields=['acierto']}
if(mode==='after'&&step===4){title='El próximo cante empieza aquí.';intro='Elige un ajuste que puedas ensayar. Una lista de diez problemas te deja más trabajo; una acción concreta te da un punto de partida.';body=field('ajuste','¿Qué vas a practicar de forma distinta?','Una acción concreta. Si no sabes cuál, escribe qué necesitas preguntar al preparador.',true)+'<div class="insight"><strong>Piensa en una práctica, no en una exigencia.</strong>«Ensayar el cambio de apartado» se puede hacer. «No volver a ponerme nervioso» no depende solo de decidirlo.</div>';fields=['ajuste']}
if(mode==='before'&&step===1){title='Recupera una referencia tuya.';intro='No necesitas sentir seguridad absoluta. Elige una situación que te recuerde que puedes practicar incluso cuando hay nervios.';body=field('ancla','Una imagen, actividad o recuerdo concreto','Una explicación que pudiste terminar, una actividad que dominas…')+'<div class="insight"><strong>El preparador está para ayudarte a ensayar.</strong>El objetivo de este encuentro es recoger información útil, también cuando aparece un tema que te cuesta.</div>';fields=['ancla']}
if(mode==='before'&&step===2){title='Dale intención a lo que dices.';intro='Además de recordar el contenido, piensa qué quieres que el preparador pueda seguir con claridad.';body=field('intencion','¿Qué quieres que se entienda de tu exposición?','Por ejemplo: que se distingan las partes del tema y su relación.',true);fields=['intencion']}
shell('<div class="eyebrow">'+(mode==='before'?'Antes de cantar':'Después del cante')+' · '+(step+1)+' de '+count+'</div><h2>'+title+'</h2><p class="lead">'+intro+'</p><form id="flow">'+body+'<p class="error hidden" id="error" role="alert"></p><div class="bottom"><button type="button" class="quiet" id="back">← '+(step?'Anterior':'Elegir otro momento')+'</button><button class="primary" type="submit">'+(step===count-1?(mode==='before'?'Ver mi ritual':'Crear mi ficha'):'Continuar')+' →</button></div></form>',(step+1)/count*100);
for(const id of fields){const el=document.getElementById(id);el.value=draft[id]||'';el.oninput=()=>draft[id]=el.value.trim()};document.querySelectorAll('[data-goal]').forEach(b=>b.onclick=()=>{goal=b.dataset.goal;document.querySelectorAll('[data-goal]').forEach(x=>{x.classList.toggle('selected',x===b);x.setAttribute('aria-pressed',x===b?'true':'false')})});bind('back',()=>{if(step){step--;wizard()}else if(demo){home()}else chooseMode();top()});document.getElementById('flow').onsubmit=e=>{e.preventDefault();for(const id of fields)draft[id]=document.getElementById(id).value.trim();if(!draft.tema||(mode==='after'&&step===1&&!draft.hechos)||(mode==='after'&&step===4&&!draft.ajuste)||(mode==='before'&&step===2&&!draft.intencion)){const err=document.getElementById('error');err.textContent='Completa el campo principal para poder preparar una ficha útil.';err.classList.remove('hidden');return}if(step<count-1){step++;wizard();top()}else if(mode==='before')ritual();else{const r={...draft,objetivo:goal,id:crypto.randomUUID(),fecha:today(),vivencia:'mixto',segundos:0};if(!demo){records.unshift(r);records=records.slice(0,100);save()}report(r);top()}}}
function ritual(){shell('<div class="eyebrow">Tu preparación para el ensayo</div><h2>No necesitas un cante perfecto.<br><em>Necesitas una intención.</em></h2><span class="tag">'+esc(draft.tema)+'</span><div class="report-grid">'+card('01 · Recuerda dónde estás','Este cante es un ensayo. Puedes recibir información útil aunque todavía haya partes que no domines.')+card('02 · Tu referencia',draft.ancla||'Puedes elegir una imagen o situación que te recuerde que eres capaz de practicar. No tienes que forzarte a sentir confianza.')+card('03 · Acepta lo que toque','Si aparece un tema difícil, úsalo para reconocer qué necesitas trabajar con tu preparador.')+card('04 · Tu intención',draft.intencion,'spotlight')+'</div><div class="insight"><strong>Tu objetivo</strong>'+esc(goals[goal][0])+'. El tiempo de exposición lo acuerdas con tu preparador; esta herramienta no fija tiempos oficiales.</div><div class="actions"><button class="primary" id="review">Ya he cantado: revisar →</button><button class="secondary" id="print">Imprimir mi ritual</button></div><p class="small">El ritual no se guarda como una ficha de revisión. Puedes imprimirlo antes de continuar.</p>');bind('review',()=>{mode='after';step=1;wizard();top()});bind('print',()=>window.print());top()}
function report(r){shell('<div class="report-head"><div class="eyebrow">'+(demo?'Así quedaría tu ficha':'Tu ficha para el próximo cante')+'</div><h2>Ya tienes un punto<br><em>por donde seguir.</em></h2><span class="tag">'+esc(r.tema)+'</span><span class="tag">'+esc(r.fecha)+'</span><p class="lead">Un cante concreto. Una observación útil. Una acción para tu próxima práctica.</p></div><div class="report-grid">'+card('Lo que ocurrió',r.hechos)+card('La corrección del preparador',r.feedback||'Todavía no has recogido una corrección. Esta ficha no sustituye su valoración.')+(r.interpretacion?card('Lo que te estás diciendo',r.interpretacion+'\n\nEs una interpretación. Contrástala con los hechos antes de convertirla en una conclusión sobre toda tu preparación.','wide'):'')+card('Qué mantener',r.acierto||'Pregunta al preparador qué comportamiento de tu exposición conviene mantener. No necesitas inventar un acierto.')+card('Tu siguiente ajuste',r.ajuste,'spotlight')+card('Una práctica para tu objetivo',practices[r.objetivo]||practices.claridad,'wide')+card('Lleva esta pregunta al preparador','Además del contenido, ¿qué ha facilitado o dificultado seguir mi exposición y qué conviene que practique primero?','wide')+'</div><div class="actions"><button class="primary" id="again">Preparar otro cante →</button><button class="secondary" id="print">Imprimir o guardar PDF</button></div><p class="small">'+(demo?'Ejemplo ficticio. Esta ficha no se ha guardado.':'Ficha guardada en este navegador si el almacenamiento está disponible. Puedes exportar una copia desde «Mis fichas».')+'</p><div class="bridge"><div class="eyebrow">Si esto se repite más allá de un cante</div><h3>Tu preparación también<br>necesita espacio para ti.</h3><p>Esta herramienta te ayuda a ordenar una práctica. Si quieres trabajar cómo sostienes el estudio y afrontas la presión, puedes conocer el programa de Inteligencia Opositora.</p><a class="secondary" href="https://juanmanuel-ruigomez.systeme.io/emcode-esencial" target="_blank" rel="noopener noreferrer">Conocer EMCODE Esencial ↗</a><p class="small">Acceso independiente a esta herramienta. Aquí no se realizan cobros.</p></div><details><summary>Cómo se prepara esta ficha</summary><p>Organiza tus propias respuestas. La práctica sugerida se selecciona según tu objetivo; no es una evaluación de tu voz, del contenido jurídico ni de tu capacidad para aprobar.</p></details>');bind('print',()=>window.print());bind('again',()=>{if(demo){home();chooseMode()}else chooseMode();top()})}
function history(){demo=false;shell('<div class="eyebrow">Tu cuaderno de práctica</div><h2>Lo que vas aprendiendo.</h2><p class="lead">Vuelve a tus fichas para reconocer qué has practicado. Se guardan en este navegador, no en una cuenta.</p><div id="entries"></div><div class="actions"><button class="secondary" id="export">Descargar copia</button><label class="secondary" for="import" style="margin:0;cursor:pointer">Recuperar copia</label><input type="file" id="import" accept=".json,application/json" class="hidden"><button class="primary" id="new">Crear otra ficha →</button></div><details><summary>Gestionar mis datos</summary><p>Al borrar los datos de tu navegador puedes perder las fichas. Descarga una copia si quieres conservarlas.</p><button class="secondary" id="delete">Borrar mis fichas</button></details>');const entries=document.getElementById('entries');if(!records.length)entries.innerHTML='<div class="insight">Tu primera ficha aparecerá aquí cuando completes la revisión de un cante.</div>';records.forEach(r=>{const el=document.createElement('article');el.className='entry';el.innerHTML='<div><strong>'+esc(r.tema)+'</strong><p>'+esc(r.fecha)+'</p></div><button class="secondary">Abrir ficha ↗</button>';el.querySelector('button').onclick=()=>{report(r);top()};entries.append(el)});bind('new',chooseMode);bind('export',()=>{const b=new Blob([JSON.stringify({version:1,registros:records},null,2)],{type:'application/json'});const u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='mis-fichas-de-cante.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)});bind('delete',()=>{if(confirm('¿Borrar todas las fichas de este navegador? Guarda antes una copia si quieres conservarlas.')){records=[];save();history()}});document.getElementById('import').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{if(f.size>1500000)throw Error();const j=JSON.parse(await f.text());if(j.version!==1||!Array.isArray(j.registros)||j.registros.length>100)throw Error();for(const r of j.registros){if(!r||!['tema','hechos','ajuste','fecha'].every(k=>typeof r[k]==='string'&&r[k].length<=12000))throw Error();for(const k of ['feedback','interpretacion','acierto'])if(r[k]!=null&&typeof r[k]!=='string')throw Error()}const ids=new Set(records.map(r=>r.id));for(const r of j.registros)if(!ids.has(r.id)){records.push(r);ids.add(r.id)}records=records.slice(0,100);save();history();msg('Copia recuperada.')}catch{msg('No se ha podido recuperar esa copia. Usa un archivo exportado desde la herramienta.')}};top()}
document.getElementById('historyBtn').onclick=history;home();
</script></body></html>
