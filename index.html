function topic(){frame('topic','<div class="eyebrow">Tu punto de partida</div><h2>Un tema. Un ajuste que practicar.</h2><p class="intro">Concreta qué quieres trabajar. La propuesta cambia con tu elección.</p>'+input('tema','¿Qué tema tienes en mente?','Por ejemplo: La causa de los contratos',d.tema,true)+opts(Object.entries(plans).filter(([k])=>['clarity','blank','pace','rehearsal','repeat','difficult'].includes(k)).map(([k,p])=>[k,p.name]),d.goal,'goal')+'<div class="live" id="goalPreview" aria-live="polite"></div>'+nav(null,'Seguir con este objetivo',false),0,12);const paint=()=>{$('goalPreview').textContent=plans[d.goal].practice};paint();bindOptions('goal',g=>{d.tema=$('tema').value.trim();d.goal=g;topic()});on('next',()=>{d.tema=$('tema').value.trim();if(!d.tema){fail('Escribe el tema o una referencia que te ayude a reconocer esta práctica.');$('tema').focus();return}step=1;render()})}
const moments=[['blank','Me quedé en blanco','Me quedé en blanco en un punto del tema.'],['pace','Me aceleré','Aceleré el ritmo durante la exposición.'],['clarity','Me costó separar los apartados','Me costó distinguir un cambio de apartado.'],['repeat','Pude retomar y continuar','Tras una pausa pude retomar el hilo y continuar.'],['other','Quiero describir otro momento','']];
function facts(){frame('facts','<div class="eyebrow">Reconocer · Lo que ocurrió</div><h2>Elige un momento. No una sentencia.</h2><p class="intro">¿Qué ocurrió en ese cante? Puedes elegir una referencia y adaptarla debajo.</p>'+opts(moments.map(x=>[x[0],x[1]]),d.fact,'fact')+input('hechos','Concrétalo con tus palabras','Dónde ocurrió, qué hiciste y cómo continuaste…',d.hechos)+'<button class="link-btn" id="showDiff">Ver la diferencia entre hecho y conclusión</button><div id="diff" class="hidden"><div class="comparison"><div class="compare"><span class="small">Conclusión sobre ti</span>«No sirvo para cantar»</div><div class="compare useful"><span class="small">Un momento que trabajar</span>«Me detuve al cambiar de apartado»</div></div><p class="small">La segunda frase permite buscar una práctica. La primera convierte el cante en una valoración de ti.</p></div><label>Sitúa esta práctica</label>'+opts([['preparador','Ante mi preparador'],['casa','En casa'],['pendiente','Aún no tengo su observación']],d.source,'source')+'<div id="feedbackBox">'+(d.source==='preparador'?input('feedback','¿Qué observó tu preparador? · opcional','Recoge sus palabras, sin inventar una valoración.',d.feedback):'<div class="live">La ficha incluirá una pregunta para contrastar tu práctica con el preparador. No inventará su corrección.</div>')+'</div>'+nav(null,'Mirar qué me he dicho después'),0,33);bindOptions('fact',v=>{d.hechos=$('hechos').value.trim();const prev=moments.find(x=>x[0]===d.fact)?.[2];const next=moments.find(x=>x[0]===v)?.[2];if(!d.hechos||d.hechos===prev)d.hechos=next||'';d.fact=v;if(v!=='other')d.moment=moments.find(x=>x[0]===v)[1];facts()});bindOptions('source',v=>{d.hechos=$('hechos').value.trim();if($('feedback'))d.feedback=$('feedback').value.trim();d.source=v;facts()});on('showDiff',()=>{$('diff').classList.toggle('hidden');$('showDiff').setAttribute('aria-expanded',String(!$('diff').classList.contains('hidden')))});on('back',()=>{d.hechos=$('hechos').value.trim();if($('feedback'))d.feedback=$('feedback').value.trim();step=0;render()});on('next',()=>{d.hechos=$('hechos').value.trim();d.feedback=d.source==='preparador'?($('feedback')?.value.trim()||''):'';if(!d.hechos)return fail('Recoge un momento concreto: puedes empezar eligiendo una opción.');if(!d.source)return fail('Indica dónde has practicado para situar la revisión.');step=2;render()})}
const thoughts=['No avanzo.','Me preocupa que vuelva a pasar.','A este ritmo no voy a llegar.','Estoy satisfecho con lo que hice.','Prefiero escribirlo con mis palabras.'];
function thought(){frame('thought','<div class="eyebrow">Reconocer · Tu interpretación</div><h2>El cante terminó. ¿Qué te sigues diciendo?</h2><p class="intro">Puedes elegir una frase, editarla o dejarla en blanco.</p>'+opts(thoughts.map((t,i)=>[String(i),t]),d.thoughtChoice,'thought')+input('interpretacion','Tu pensamiento · opcional','Escribe la frase que aparece después del cante.',d.interpretacion)+'<div class="live" id="contrast" aria-live="polite">'+contrastText()+'</div>'+input('acierto','¿Qué te gustaría repetir? · opcional','Un comportamiento concreto. Si no lo ves, puedes preguntarlo.',d.acierto)+'<div class="small">Pregunta a tu preparador qué conviene repetir, más allá de un «muy bien».</div>'+nav(null,'Ver cómo puedo trabajarlo'),0,48);bindOptions('thought',v=>{d.acierto=$('acierto').value.trim();d.thoughtChoice=v;d.interpretacion=v==='4'?'':thoughts[Number(v)];thought()});on('back',()=>{d.interpretacion=$('interpretacion').value.trim();d.acierto=$('acierto').value.trim();step=1;render()});on('next',()=>{d.interpretacion=$('interpretacion').value.trim();d.acierto=$('acierto').value.trim();exerciseStep=0;step=3;render()})}
function contrastText(){if(d.thoughtChoice==='3')return 'Puedes reconocer un buen momento. Concretar qué hiciste te ayudará a buscar cómo repetirlo.';if(d.thoughtChoice==='2')return 'Esta frase habla del futuro. Contrástala con la planificación y con tu preparador: la herramienta no calcula si llegarás al examen.';if(d.thoughtChoice==='0')return '¿Qué dato de este cante sostiene esa conclusión? Ponlo junto a la corrección del preparador antes de extenderlo a toda tu preparación.';return 'Lo que ocurrió: '+E(d.hechos||'aún por registrar')+'<br><br>Una práctica concreta no permite predecir por sí sola el resultado de tu oposición.'}
function anchor(){frame('anchor','<div class="eyebrow">Prepararte · Tu referencia</div><h2>No necesitas entrar solo con fuerza de voluntad.</h2><p class="intro">Elige una referencia personal que te ayude a recordar cómo actúas cuando puedes practicar.</p>'+opts([['activity','Una actividad que domino','Puede ser una ruta conocida, un deporte o una tarea.'],['memory','Una explicación que pude terminar','Aunque al principio hubiera nervios.'],['own','Tengo otra referencia personal']],d.anchorChoice,'anchor')+input('ancla','Mi referencia · opcional','Concreta una imagen, actividad o recuerdo significativo.',d.ancla)+'<div class="live">No necesitas sentir confianza absoluta ni elegir la imagen que le sirve a otra persona.</div>'+nav(null,'Dar intención al ensayo'),0,32);bindOptions('anchor',v=>{d.anchorChoice=v;d.ancla=v==='activity'?'Pienso en una actividad que domino y en cómo actúo al realizarla.':v==='memory'?'Recuerdo una explicación que pude terminar aunque al principio había nervios.':$('ancla').value;anchor()});on('back',()=>{d.ancla=$('ancla').value.trim();step=0;render()});on('next',()=>{d.ancla=$('ancla').value.trim();step=2;render()})}
function intention(){frame('anchor','<div class="eyebrow">Prepararte · Tu intención</div><h2>¿Qué quieres que pueda seguirse mejor?</h2><p class="intro">Elige una acción que ayude a seguir tu exposición.</p>'+opts([['parts','Que se distingan los apartados'],['interest','Transmitir interés por la idea principal'],['voice','Vocalizar con claridad']],d.intentionChoice,'intention')+input('intencion','Mi intención para este ensayo','Por ejemplo: marcar el cambio de apartado con una pausa.',d.intencion)+'<div class="insight"><strong>Si toca un tema difícil</strong>Úsalo como una ocasión de práctica y recoge qué necesitas trabajar. La sesión ante el preparador sigue siendo un ensayo.</div>'+nav(null,'Probar mi ajuste'),0,48);bindOptions('intention',v=>{d.intentionChoice=v;d.intencion={parts:'Quiero que se distingan los apartados y sus transiciones.',interest:'Quiero exponer con interés y destacar la idea principal.',voice:'Quiero vocalizar con claridad en el fragmento elegido.'}[v];intention()});on('back',()=>{d.intencion=$('intencion').value.trim();step=1;render()});on('next',()=>{d.intencion=$('intencion').value.trim();if(!d.intencion)return fail('Elige o escribe una intención concreta para tu práctica.');step=3;exerciseStep=0;render()})}
function practice(){const p=plans[key(d)];let content='<div class="eyebrow">Ensayar · '+(exerciseStep+1)+' de 3</div><h2>'+p.name+'</h2><p class="intro">'+p.why+' Puedes probar una práctica ahora o guardarla para después.</p><div class="exercise"><div class="exercise-steps"><button data-ex="0" '+(exerciseStep===0?'class="active"':'')+'>1 · Preparar</button><button data-ex="1" '+(exerciseStep===1?'class="active"':'')+'>2 · Ensayar</button><button data-ex="2" '+(exerciseStep===2?'class="active"':'')+'>3 · Observar</button></div>';
if(exerciseStep===0)content+='<div class="eyebrow">Elige un fragmento, no todo el temario</div><h3>Hazlo concreto antes de empezar.</h3><p>'+p.before+'</p>'+input('fragmento','¿Qué fragmento vas a ensayar?','Por ejemplo: la transición al segundo apartado.',d.fragmento||d.moment,true)+'<p class="small">No escribas el desarrollo jurídico. Usa una referencia que tú reconozcas.</p>';
if(exerciseStep===1)content+='<div class="eyebrow">Tu ensayo, en voz alta</div><h3>'+E(d.fragmento||'El fragmento que has elegido')+'</h3><p>'+p.practice+'</p>'+drillGraphic()+'<div class="timer"><div class="pulse '+(running?'running':'')+'" id="pulse" aria-hidden="true"><svg viewBox="0 0 40 40"><path d="M7 21v-2m6 9V12m7 22V6m7 22V12m6 10v-4" stroke-linecap="round"/></svg></div><div class="clock" id="clock" role="timer" aria-label="Tiempo de práctica">'+clock()+'</div><p class="small">Tiempo transcurrido · Sin alarma ni duración obligatoria.</p><div class="actions" style="justify-content:center"><button id="toggleTimer" class="primary">'+(running?'Pausar reloj':elapsed?'Continuar reloj':'Iniciar reloj opcional')+'</button><button id="resetTimer" class="secondary">Reiniciar</button></div></div><p class="small">El reloj es opcional. No se escucha ni se graba tu voz. Este ensayo de un fragmento no sustituye una simulación completa ni fija tiempos oficiales.</p>';
if(exerciseStep===2)content+='<div class="eyebrow">Tu observación, no una evaluación automática</div><h3>¿Qué has observado al probarlo?</h3><p>Elige lo que se ajuste a esta práctica. No necesitas haber notado una mejora para recoger información.</p>'+opts([['better','Pude aplicar el ajuste en este fragmento'],['hard','Me costó y necesito volver a ensayarlo'],['ask','Necesito contrastarlo con mi preparador'],['later','Lo voy a practicar más adelante']],d.observation,'observation')+input('observacion','Un detalle que quiero recordar · opcional','Qué hiciste, dónde costó o qué necesitas consultar.',d.observacion);
content+='</div><div class="error hidden" id="error" role="alert"></div><div class="footer-actions"><button class="text-btn" id="back">← Anterior</button><button class="primary" id="next">'+(exerciseStep===0?'Entrar en mi ensayo':exerciseStep===1?'He terminado: observar':'Crear mi hoja de práctica')+' →</button></div>'+(exerciseStep<2?'<div class="mode-link"><button id="skip">Prefiero guardar la práctica para después</button></div>':'');frame('practice',content,1,60+exerciseStep*12);document.querySelectorAll('[data-ex]').forEach(b=>b.onclick=()=>{if(exerciseStep===0){d.fragmento=$('fragmento').value.trim();if(!d.fragmento&&Number(b.dataset.ex)>0)return fail('Escribe una referencia breve del fragmento que quieres practicar.')}stop();exerciseStep=Number(b.dataset.ex);practice()});on('back',()=>{stop();if(exerciseStep===0){d.fragmento=$('fragmento').value.trim();step=2;render()}else{if(exerciseStep===2)d.observacion=$('observacion').value.trim();exerciseStep--;practice();up()}});on('next',()=>{if(exerciseStep===0){d.fragmento=$('fragmento').value.trim();if(!d.fragmento)return fail('Escribe qué fragmento quieres ensayar, aunque sea una referencia breve.');exerciseStep=1;practice();up()}else if(exerciseStep===1){stop();d.tried=true;exerciseStep=2;practice();up()}else{if(!d.observation)return fail('Selecciona qué has observado o indica que lo practicarás más adelante.');d.observacion=$('observacion').value.trim();d.outcome={better:'Indicas que pudiste aplicar el ajuste en el fragmento.',hard:'Indicas que te costó y necesitas volver a ensayarlo.',ask:'Quieres contrastar el ensayo con tu preparador.',later:'Has elegido practicarlo más adelante.'}[d.observation];finish()}});on('skip',()=>{if($('fragmento'))d.fragmento=$('fragmento').value.trim();stop();d.observation='later';d.outcome='Has elegido practicarlo más adelante.';finish()});on('toggleTimer',()=>{if(running)stop();else{started=Date.now();running=true;timerId=setInterval(()=>{if($('clock'))$('clock').textContent=clock()},500)}$('toggleTimer').textContent=running?'Pausar reloj':elapsed?'Continuar reloj':'Iniciar reloj opcional';$('pulse').classList.toggle('running',running)});on('resetTimer',()=>{stop();elapsed=0;practice()});bindOptions('observation',v=>{d.observacion=$('observacion').value.trim();d.observation=v;practice()})}
function finish(){stop();const p=plans[key(d)];const r={...d,id:crypto.randomUUID(),fecha:new Date().toLocaleDateString('es-ES'),goal:key(d),objetivo:{clarity:'claridad',blank:'recuperar',pace:'tiempo',rehearsal:'preparador',repeat:'mantener',difficult:'dificil',energy:'claridad'}[key(d)],hechos:d.hechos||'Preparación previa del ensayo; todavía no se ha registrado un cante.',ajuste:p.practice,segundos:Math.floor(elapsed),vivencia:'mixto',mode};if(!demo){records.unshift(r);records=records.slice(0,100);r.saved=persist()}showReport(r);up()}
function showReport(r){screen='report';current=r;const p=plans[key(r)];app.innerHTML='<div class="report"><div class="topline"><button class="text-btn" id="home">← Inicio</button>'+rail(2)+'</div>'+(demo?'<div class="demo"><b>Ejemplo ficticio · Notarías.</b> Esta hoja no se ha guardado ni representa un resultado real.</div>':'')+'<div class="result-head"><div class="eyebrow">Tu hoja de práctica</div><h2>Tu próximo cante <em>ya tiene una dirección.</em></h2><span class="result-tag">'+E(r.tema)+'</span><span class="result-tag">'+E(r.fecha)+'</span><p class="small">'+E(r.outcome||'Práctica pendiente de realizar.')+' '+(r.segundos>0?'Tiempo registrado: '+Math.floor(r.segundos/60)+' min '+r.segundos%60+' s.':'')+'</p></div>'+(r.state&&states[r.state]?'<div class="state-summary"><span>Así dijiste que llegabas</span><strong>'+states[r.state].label+'</strong><p>'+states[r.state].note+'</p></div>':'')+'<div class="result-trio"><article><div class="eyebrow">Mantener</div><p>'+E(r.acierto||r.intencion||'Identificar con el preparador qué conviene repetir.')+'</p></article><article><div class="eyebrow">Entrenar</div><p>'+E(p.name)+'</p></article><article><div class="eyebrow">Preguntar</div><p>'+E(p.question)+'</p></article></div><section class="result-body"><div class="eyebrow">Del ensayo al siguiente cante</div><h3>Así puedes continuar.</h3>'+[['Antes de empezar',p.before],['Durante el ensayo',p.practice],['Al terminar',p.question],['En la siguiente vuelta al tema',p.check]].map((x,i)=>'<div class="plan-row"><div class="n">'+String(i+1).padStart(2,'0')+'</div><div><strong>'+x[0]+'</strong><p>'+x[1]+'</p></div></div>').join('')+(r.fragmento?'<div class="record-line"><b>Tu fragmento</b>'+E(r.fragmento)+'</div>':'')+(r.observacion?'<div class="record-line"><b>Lo que has observado al ensayar</b>'+E(r.observacion)+'</div>':'')+'<div class="insight"><strong>Tu preparación académica sigue con tu preparador.</strong>Esta propuesta se selecciona por la prioridad que has elegido. No analiza tu exposición ni deduce por qué te ha ocurrido algo.</div><details open><summary>Lo que has registrado</summary>'+[['Lo que ocurrió',r.hechos],['Observación del preparador',r.feedback||'No has registrado una observación del preparador.'],['Tu interpretación',r.interpretacion],['Tu referencia previa',r.ancla],['Tu intención',r.intencion],['Tu siguiente ajuste',r.ajuste]].filter(x=>x[1]).map(x=>'<div class="record-line"><b>'+x[0]+'</b>'+E(x[1])+'</div>').join('')+'</details><div class="actions"><button class="primary" id="print">Imprimir o guardar PDF</button><button class="secondary" id="again">Preparar otra práctica</button>'+(r.mode==='before'?'<button class="secondary" id="reviewNow">Ya he cantado: revisar →</button>':'')+'</div><p class="small">'+(demo?'El ejemplo no se añade al historial.':r.saved===false?'No se pudo guardar en este navegador. Imprime una copia.':'Las fichas se guardan en este navegador. Descarga una copia desde «Mis prácticas» para conservarlas.')+'</p></section><section class="bridge"><div><h3>Cuando la dificultad va más allá de un cante.</h3><p>Si quieres trabajar cómo sostienes el estudio y afrontas la presión, puedes conocer el programa de Inteligencia Opositora.</p></div><a class="primary" href="https://juanmanuel-ruigomez.systeme.io/emcode-esencial" target="_blank" rel="noopener noreferrer">Conocer EMCODE Esencial ↗</a></section><details><summary>Sobre esta hoja de práctica</summary><p>La observación del ensayo la aportas tú: la herramienta no califica tu voz ni predice el resultado del examen. La compra de Esencial es independiente; aquí no se realizan cobros.</p></details></div>';on('home',home);on('print',()=>window.print());on('again',()=>begin(key(r)));on('reviewNow',()=>{demo=false;mode='review';d={tema:r.tema,goal:key(r),hechos:'',feedback:'',source:'',intencion:r.intencion,ancla:r.ancla};step=1;render()})}
function history(){stop();demo=false;screen='history';app.innerHTML='<div class="report"><div class="topline"><button class="text-btn" id="home">← Inicio</button><span class="eyebrow">Mis prácticas</span></div><div class="result-body"><h2>Lo que vas entrenando.</h2><p class="small">Tus observaciones, ajustes y preguntas al preparador. Guardados en este navegador.</p><div id="entries"></div><div class="actions"><button class="primary" id="new">Preparar otra práctica →</button><button class="secondary" id="export">Descargar copia</button><label class="secondary" for="import" style="margin:0;cursor:pointer">Recuperar copia</label><input type="file" id="import" accept=".json,application/json" class="hidden"></div><details><summary>Gestionar mis datos</summary><p>Al borrar los datos del navegador puedes perder tus fichas. Descarga una copia si quieres conservarlas.</p><button class="secondary" id="delete">Borrar mis prácticas</button><div id="deleteBox"></div></details></div></div>';if(!records.length)$('entries').innerHTML='<div class="insight">Tu primera hoja aparecerá aquí cuando termines una práctica propia. Los ejemplos no se guardan.</div>';records.forEach(r=>{const el=document.createElement('article');el.className='entry';el.innerHTML='<div><strong>'+E(r.tema)+'</strong><p>'+E(r.fecha)+' · '+E(plans[key(r)].name)+'</p></div><button class="secondary">Abrir hoja ↗</button>';el.querySelector('button').onclick=()=>{demo=false;showReport(r);up()};$('entries').append(el)});on('home',home);on('new',()=>begin());on('export',()=>{const b=new Blob([JSON.stringify({version:1,registros:records},null,2)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='mis-fichas-de-cante.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)});on('delete',()=>{$('deleteBox').innerHTML='<div class="insight"><p>¿Borrar todas las hojas de este navegador?</p><div class="actions"><button class="secondary" id="cancelDelete">Cancelar</button><button class="primary" id="confirmDelete">Sí, borrar mis prácticas</button></div></div>';$('delete').disabled=true;on('cancelDelete',history);on('confirmDelete',()=>{records=[];persist();history();tell('Prácticas borradas de este navegador.')})});$('import').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{if(f.size>1500000)throw Error();const j=JSON.parse(await f.text());if(j.version!==1||!Array.isArray(j.registros)||j.registros.length>100)throw Error();for(const r of j.registros){if(!r||!['tema','fecha','hechos','ajuste'].every(k=>typeof r[k]==='string'&&r[k].length<=12000))throw Error();for(const k of ['goal','objetivo','focus','feedback','interpretacion','acierto','ancla','intencion','fragmento','observacion','outcome'])if(r[k]!=null&&(typeof r[k]!=='string'||r[k].length>12000))throw Error()}const ids=new Set(records.map(r=>r.id));for(const r of j.registros)if(!ids.has(r.id)){records.push(r);ids.add(r.id)}records=records.slice(0,100);persist();history();tell('Copia recuperada.')}catch{tell('No se ha podido recuperar la copia. Usa un archivo exportado desde la herramienta.')}};up()}
$('historyBtn').onclick=history;home();
})();</script></body></html>
