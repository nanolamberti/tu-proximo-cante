}.demo{background:var(--lilac);color:var(--purple);border-radius:8px;padding:12px 17px;font-size:12px;margin-bottom:24px}.error{font-size:13px;color:#923b34;margin:12px 0}.bottom{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-top:30px}.report-head{border-bottom:1px solid var(--line);padding-bottom:22px;margin-bottom:25px}.report-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.report-card{padding:23px;border:1px solid var(--line);border-radius:10px;background:#fff}.report-card .eyebrow{font-size:10px;letter-spacing:.1em}.report-card p{font-size:14px;white-space:pre-wrap}.wide{grid-column:1/-1}.spotlight{background:var(--purple);color:#fff;border:0}.spotlight .eyebrow{color:#d6c3e3}.spotlight p{font-family:Georgia,serif;font-size:25px;line-height:1.35}.bridge{border-top:1px solid var(--line);padding-top:30px;margin-top:35px}.bridge p{font-size:14px;color:var(--muted)}.tag{font-size:11px;display:inline-block;background:var(--lilac);color:var(--purple);padding:5px 10px;border-radius:20px;margin:0 8px 8px 0}.entry{padding:22px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:20px;align-items:center}.entry strong{font-size:15px}.entry p{font-size:12px;color:var(--muted);margin:4px 0}details{font-size:12px;color:var(--muted);margin-top:30px}summary{cursor:pointer}footer{border-top:1px solid var(--line);max-width:1180px;margin:auto;padding:24px 40px;display:flex;justify-content:space-between;gap:20px;font-size:11px;color:var(--muted)}.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:var(--purple);color:white;padding:13px 22px;border-radius:8px;font-size:13px;z-index:9;max-width:90%}@media(max-width:760px){header{padding:17px 22px}header img{width:135px}.pill{display:none}main{padding:34px 22px 50px}.hero{grid-template-columns:1fr;gap:30px}h1{font-size:47px}.visual{min-height:310px;padding:5px 10px 40px}.sheet{max-width:310px;padding:23px}.sheet .bad{font-size:25px}.sheet .good{font-size:23px}.floating{right:0;bottom:0;max-width:230px}.route{margin-top:40px;grid-template-columns:1fr;gap:22px}.route>div{display:grid;grid-template-columns:30px 1fr}.route p{grid-column:2}.panel{padding:25px 21px}.report-grid{grid-template-columns:1fr}.wide{grid-column:auto}.toolbar{font-size:12px}.top-actions{gap:12px}.primary,.secondary{font-size:13px;padding:14px 17px}.authority{gap:15px}footer{padding:22px;display:block}.entry{align-items:flex-start}.entry .secondary{white-space:nowrap}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}@media print{header,footer,.toolbar,.progress,.actions,.bottom,.bridge,.demo,details,.toast{display:none!important}body{background:white}main{padding:0}.panel{border:0;box-shadow:none;padding:0}.report-card{break-inside:avoid}.spotlight{color:black;background:#eee}.spotlight .eyebrow{color:black}.workspace{max-width:none}}

</style></head><body><header><a href="https://inteligenciaopositora.com/" aria-label="Inteligencia Opositora"><img alt="Inteligencia Opositora" src="https://inteligenciaopositora.com/wp-content/uploads/2022/06/Inteligencia-opositora-logo-ompfhh6ew99kmp8b3kw618y94f8fkfm86namhgc58k.png"></a><div class="top-actions"><span class="pill">Tu próximo cante</span><button class="quiet" id="historyBtn">Mis fichas ↗</button></div></header><main id="main"></main><footer><span>Inteligencia Opositora · Entrenamiento mental con Juan Manuel Ruigómez</span><span>Tu temario y su corrección siguen en manos de tu preparador.</span></footer><div id="toast" class="toast hidden" role="status"></div><script>
(()=>{
const main=document.getElementById('main'),key='io-cante-v1';let records=[],draft={},step=0,mode='after',demo=false,goal='claridad',timer;let today=()=>new Date().toLocaleDateString('es-ES');try{const s=JSON.parse(localStorage.getItem(key)||'{}');records=Array.isArray(s.registros)?s.registros.filter(x=>x&&typeof x.tema==='string'&&typeof x.hechos==='string').slice(0,100):[]}catch{}
const goals={claridad:['Que se distingan mejor las partes del tema','Transiciones, pausas e ideas importantes.'],recuperar:['Retomar el hilo cuando me atasco','Practicar cómo continuar sin dar todo por perdido.'],preparador:['Llegar al preparador sin vivirlo como un veredicto','Entrar en el ensayo con una intención concreta.'],dificil:['Dejar de evitar el tema que más me cuesta','Acercarme a una dificultad que necesito trabajar.']};
const practices={claridad:'Elige el cambio de apartado que te costó. Ensaya ese fragmento marcando la transición y la idea principal. Pide al preparador que te indique si resulta más fácil seguirte.',recuperar:'Lleva al preparador el punto concreto donde perdiste el hilo. Acuerda cómo retomarlo y practica ese fragmento manteniendo el rigor del contenido, sin inventar artículos ni afirmaciones.',preparador:'Antes del siguiente encuentro, relee un hecho y una corrección de esta ficha. Lleva una pregunta concreta sobre tu exposición para que el cante te dé información útil.',dificil:'Elige un fragmento del tema que tiendes a evitar. Practícalo con la intención que has preparado y recoge qué necesitas consultar al preparador.'};
const example={tema:'La causa de los contratos',hechos:'Al cambiar de apartado me quedé en silencio. Repetí la última frase, hice una pausa y pude continuar sin empezar el tema de nuevo.',feedback:'El contenido estaba, pero en el cambio de apartado me costó seguirte. Trabaja esa transición y deja que se distinga la idea principal.',interpretacion:'Si me atasco aquí, no voy a ser capaz de cantar ante el tribunal.',acierto:'Después de la pausa retomé el hilo y seguí con el tema.',ajuste:'Ensayar esa transición con una pausa y pedir al preparador que me diga si se distingue mejor.',ancla:'Recuerdo una explicación que conseguí terminar con calma, aunque empecé nervioso.',intencion:'Que se distingan las partes del tema, sin correr al cambiar de apartado.'};
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function msg(s){const t=document.getElementById('toast');t.textContent=s;t.classList.remove('hidden');clearTimeout(timer);timer=setTimeout(()=>t.classList.add('hidden'),4000)}function save(){try{localStorage.setItem(key,JSON.stringify({version:1,registros:records}));return true}catch{msg('No se ha podido guardar. Imprime la ficha para conservarla.');return false}}function bind(id,fn){const e=document.getElementById(id);if(e)e.onclick=fn}function top(){window.scrollTo({top:0,behavior:'smooth'})}function card(label,value,cls=''){return '<article class="report-card '+cls+'"><div class="eyebrow">'+label+'</div><p>'+esc(value)+'</p></article>'}
function home(){demo=false;main.innerHTML=`<section class="hero"><div class="hero-copy"><div class="eyebrow">Para tu preparación de Notarías</div><h1>Que un mal cante<br>no decida cómo<br><em>estudias mañana.</em></h1><p>Prepara cómo vas a entrar. Separa lo que pasó de lo que te estás diciendo. Y sal con un ajuste concreto para el siguiente cante.</p><div class="actions"><button class="primary" id="start">Preparar mi próximo cante <span>→</span></button><button class="secondary" id="demoBtn">Ver un ejemplo de Notarías</button></div><p class="micro">Sin registro · A tu ritmo · Tus fichas se quedan en este navegador</p></div><div class="visual" aria-label="De una valoración general a una práctica concreta"><div class="sheet"><div class="label">Lo que te dices al salir</div><p class="bad">«Me ha salido fatal.<br>No avanzo.»</p><hr><div class="label">Lo que puedes trabajar</div><p class="good">«Me atasqué al cambiar de apartado. Voy a ensayar esa transición.»</p><span class="tag">Una acción, no una sentencia.</span></div><div class="floating"><b>Tu próxima práctica</b>Un fragmento. Una intención.<br>Una pregunta al preparador.</div></div></section><section class="route"><div><span>01</span><b>Antes: entra con una intención</b><p>Elige qué quieres practicar, sin exigirte cambiarlo todo.</p></div><div><span>02</span><b>Después: recoge lo que ocurrió</b><p>Hechos, correcciones y pensamientos, cada uno en su sitio.</p></div><div><span>03</span><b>La próxima vez: lleva un ajuste</b><p>Conserva lo que funcionó y concreta qué vas a ensayar.</p></div></section><div class="authority"><span class="jm" aria-hidden="true">JM</span><div><p><b>Basada en las lecciones de Juan Manuel Ruigómez sobre el cante.</b></p><p class="muted">Abogado del Estado, dedicado a la preparación mental de opositores desde 2004. Esta herramienta organiza tu reflexión; la valoración académica corresponde a tu preparador.</p></div></div><details><summary>Qué hace esta herramienta y dónde se guardan tus datos</summary><p>Organiza tus respuestas y propone una práctica según el objetivo elegido. No escucha grabaciones, no utiliza IA generativa ni califica tu cante. Las adaptaciones de las lecciones están pendientes de validación final por Juan Manuel. No incluye cobros ni acceso protegido por compra.</p><p>Las fichas se guardan solo en este navegador. Puedes exportarlas, importarlas o borrarlas en «Mis fichas». No se envían a Juan Manuel ni a Systeme.</p></details>`;bind('start',chooseMode);bind('demoBtn',()=>{demo=true;draft={...example};goal='claridad';mode='after';step=0;wizard();top()});top()}
function shell(content,progress=0){main.innerHTML='<div class="workspace"><div class="toolbar"><button class="quiet" id="homeBtn">← Volver al inicio</button><span class="eyebrow">Tu próximo cante</span></div>'+(progress?'<div class="progress" aria-label="Progreso"><span style="width:'+progress+'%"></span></div>':'')+(demo?'<div class="demo"><strong>Ejemplo ficticio · Notarías.</strong> Recorre las respuestas y descubre la ficha final. No se guarda en tu historial ni cambia tus fichas.</div>':'')+'<section class="panel">'+content+'</section></div>';bind('homeBtn',()=>{if(Object.keys(draft).length&&!demo&&!confirm('¿Volver al inicio? Las respuestas de este recorrido aún no se han guardado en una ficha.'))return;home()})}
function chooseMode(){demo=false;draft={};goal='claridad';shell('<div class="eyebrow">Empieza donde estás</div><h2>¿En qué momento<br>te encuentras?</h2><p class="lead">Elige lo que necesitas hoy. Puedes preparar el ensayo o revisar un cante que ya has hecho.</p><div class="choices"><button class="choice" id="before"><span class="icon">↗</span><span><strong>Voy a cantar</strong><small>Quiero entrar con una intención y preparar mi ritual.</small></span></button><button class="choice" id="after"><span class="icon">↺</span><span><strong>Ya he cantado</strong><small>Quiero recoger lo útil y saber qué practicar después.</small></span></button></div>');for(const m of ['before','after'])bind(m,()=>{mode=m;step=0;wizard();top()});top()}
function goalChoices(){return '<div class="choices">'+Object.entries(goals).map(([k,v],i)=>'<button type="button" class="choice '+(goal===k?'selected':'')+'" data-goal="'+k+'" aria-pressed="'+(goal===k)+'"><span class="icon">'+String(i+1).padStart(2,'0')+'</span><span><strong>'+v[0]+'</strong><small>'+v[1]+'</small></span></button>').join('')+'</div>'}
function field(id,label,placeholder,required=false,short=false){return '<label for="'+id+'">'+label+(required?'':' <span class="small">· opcional</span>')+'</label>'+(short?'<input':'<textarea')+' id="'+id+'" maxlength="2500" '+(required?'required':'')+' placeholder="'+placeholder+'">'+(short?'':esc(draft[id]||'')+'</textarea>')}
function wizard(){let title='',intro='',body='',fields=[];const count=mode==='before'?3:5;if(step===0){title='Un tema. Un objetivo.';intro='Piensa en una práctica concreta. Tu ficha será más útil si eliges una sola cosa que trabajar.';body=field('tema','¿Qué tema vas a trabajar?', 'Por ejemplo: La causa de los contratos',true,true)+goalChoices();fields=['tema']}
if(mode==='after'&&step===1){title='¿Qué pasó, exactamente?';intro='«Me ha salido mal» no te dice qué practicar. Un momento concreto, sí.';body=field('hechos','Describe lo que ocurrió','Dónde te atascaste, cómo continuaste, qué pudiste terminar…',true)+field('feedback','¿Qué observó tu preparador?','Recoge su corrección. Si has practicado en casa, puedes dejarlo vacío.')+'<div class="insight"><strong>Quédate con algo observable.</strong>«Me detuve al cambiar de apartado» describe un hecho. «Soy un desastre» no describe tu exposición.</div>';fields=['hechos','feedback']}
if(mode==='after'&&step===2){title='¿Y qué te has dicho después?';intro='A veces el cante termina, pero tú sigues dentro. Pon aquí ese pensamiento para poder mirarlo junto a los hechos.';body=field('interpretacion','¿Qué conclusión te ha venido a la cabeza?','Por ejemplo: Si me pasa esto ahora, no voy a poder en el examen.')+'<div class="insight"><strong>Una práctica no resume toda tu preparación.</strong>Tu interpretación merece atención. También merece que la contrastes con lo que ocurrió y con la corrección del preparador.</div>';fields=['interpretacion']}
if(mode==='after'&&step===3){title='¿Qué conviene conservar?';intro='Un cante difícil también puede contener algo que te ayudó. No hace falta que todo haya salido bien para reconocerlo.';body=field('acierto','Un comportamiento que quieres repetir','Por ejemplo: retomé el hilo después de la pausa.')+'<p class="hint">Si aún no lo ves, déjalo en blanco. La ficha te dará una pregunta para tu preparador.</p>';fields=['acierto']}
if(mode==='after'&&step===4){title='El próximo cante empieza aquí.';intro='Elige un ajuste que puedas ensayar. Una lista de diez problemas te deja más trabajo; una acción concreta te da un punto de partida.';body=field('ajuste','¿Qué vas a practicar de forma distinta?','Una acción concreta. Si no sabes cuál, escribe qué necesitas preguntar al preparador.',true)+'<div class="insight"><strong>Piensa en una práctica, no en una exigencia.</strong>«Ensayar el cambio de apartado» se puede hacer. «No volver a ponerme nervioso» no depende solo de decidirlo.</div>';fields=['ajuste']}
if(mode==='before'&&step===1){title='Recupera una referencia tuya.';intro='No necesitas sentir seguridad absoluta. Elige una situación que te recuerde que puedes practicar incluso cuando hay nervios.';body=field('ancla','Una imagen, actividad o recuerdo concreto','Una explicación que pudiste terminar, una actividad que dominas…')+'<div class="insight"><strong>El preparador está para ayudarte a ensayar.</strong>El objetivo de este encuentro es recoger información útil, también cuando aparece un tema que te cuesta.</div>';fields=['ancla']}
if(mode==='before'&&step===2){title='Dale intención a lo que dices.';intro='Además de recordar el contenido, piensa qué quieres que el preparador pueda seguir con claridad.';body=field('intencion','¿Qué quieres que se entienda de tu exposición?','Por ejemplo: que se distingan las partes del tema y su relación.',true);fields=['intencion']}

get="_blank" rel="noopener noreferrer">Conocer EMCODE Esencial ↗</a><p class="small">Acceso independiente a esta herramienta. Aquí no se realizan cobros.</p></div><details><summary>Cómo se prepara esta ficha</summary><p>Organiza tus propias respuestas. La práctica sugerida se selecciona según tu objetivo; no es una evaluación de tu voz, del contenido jurídico ni de tu capacidad para aprobar.</p></details>');bind('print',()=>window.print());bind('again',()=>{if(demo){home();chooseMode()}else chooseMode();top()})}
function history(){demo=false;shell('<div class="eyebrow">Tu cuaderno de práctica</div><h2>Lo que vas aprendiendo.</h2><p class="lead">Vuelve a tus fichas para reconocer qué has practicado. Se guardan en este navegador, no en una cuenta.</p><div id="entries"></div><div class="actions"><button class="secondary" id="export">Descargar copia</button><label class="secondary" for="import" style="margin:0;cursor:pointer">Recuperar copia</label><input type="file" id="import" accept=".json,application/json" class="hidden"><button class="primary" id="new">Crear otra ficha →</button></div><details><summary>Gestionar mis datos</summary><p>Al borrar los datos de tu navegador puedes perder las fichas. Descarga una copia si quieres conservarlas.</p><button class="secondary" id="delete">Borrar mis fichas</button></details>');const entries=document.getElementById('entries');if(!records.length)entries.innerHTML='<div class="insight">Tu primera ficha aparecerá aquí cuando completes la revisión de un cante.</div>';records.forEach(r=>{const el=document.createElement('article');el.className='entry';el.innerHTML='<div><strong>'+esc(r.tema)+'</strong><p>'+esc(r.fecha)+'</p></div><button class="secondary">Abrir ficha ↗</button>';el.querySelector('button').onclick=()=>{report(r);top()};entries.append(el)});bind('new',chooseMode);bind('export',()=>{const b=new Blob([JSON.stringify({version:1,registros:records},null,2)],{type:'application/json'});const u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='mis-fichas-de-cante.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)});bind('delete',()=>{const box=document.createElement('div');box.className='insight';box.innerHTML='<p>¿Borrar todas las fichas de este navegador? Descarga una copia si quieres conservarlas.</p><div class="actions"><button type="button" class="secondary" id="cancelDelete">Cancelar</button><button type="button" class="primary" id="confirmDelete">Sí, borrar mis fichas</button></div>';document.getElementById('delete').after(box);document.getElementById('delete').disabled=true;bind('cancelDelete',()=>history());bind('confirmDelete',()=>{records=[];save();history();msg('Fichas borradas de este navegador.')})});document.getElementById('import').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{if(f.size>1500000)throw Error();const j=JSON.parse(await f.text());if(j.version!==1||!Array.isArray(j.registros)||j.registros.length>100)throw Error();for(const r of j.registros){if(!r||!['tema','hechos','ajuste','fecha'].every(k=>typeof r[k]==='string'&&r[k].length<=12000))throw Error();for(const k of ['feedback','interpretacion','acierto'])if(r[k]!=null&&typeof r[k]!=='string')throw Error()}const ids=new Set(records.map(r=>r.id));for(const r of j.registros)if(!ids.has(r.id)){records.push(r);ids.add(r.id)}records=records.slice(0,100);save();history();msg('Copia recuperada.')}catch{msg('No se ha podido recuperar esa copia. Usa un archivo exportado desde la herramienta.')}};top()}
